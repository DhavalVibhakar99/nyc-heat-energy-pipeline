# Connection settings, read from environment variables - this file holds no secrets.
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER     who to log in as
#   SNOWFLAKE_PRIVATE_KEY_PATH            optional; defaults to ~/.snowflake/rsa_key.p8
# Locally these come from ~/.bashrc; in GitHub Actions, from repository secrets.
heatwatch:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.snowflake/rsa_key.p8') }}"
      role: ACCOUNTADMIN
      warehouse: HEATWATCH_WH
      database: HEATWATCH
      schema: STAGING
      threads: 4
